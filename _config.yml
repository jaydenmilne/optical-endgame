title: Optical Endgame
tagline: Keeping the movies we own watchable
description: >-
  It's time someone stood up for lawful owners of movies.

# The site uses a custom domain, so it is served from the root path.
url: "https://opticalendgame.jayd.ml"
baseurl: ""

theme: just-the-docs
color_scheme: dark

# Just the Docs 0.12 still uses these supported Sass APIs internally. Suppress
# upstream migration notices so local build output stays useful.
sass:
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

permalink: /updates/:year/:month/:day/:title/
timezone: America/Denver
lang: en-US

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
nav_sort: case_insensitive
back_to_top: true
back_to_top_text: Back to top
favicon_ico: "/assets/images/favicon.svg"

footer_content: >-
  Optical Endgame is just a very motivated individual who is not a lawyer. This 
  is not legal advice.

callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: default
      parent: Updates
      nav_exclude: true

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - assets/claims/pdf
  - vendor
